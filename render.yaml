services:
  - type: web
    name: revisatucuenta-demo
    runtime: node
    plan: free
    buildCommand: npm install --no-package-lock && npm run build
    startCommand: npm run start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22.13.0"
      - key: REVISA_VOLATILE_MODE
        value: "true"
